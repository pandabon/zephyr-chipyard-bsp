# `west build -S debug`: an image for gdb/OpenOCD. Low optimisation keeps variables and source
# stepping intact.
CONFIG_DEBUG_OPTIMIZATIONS=y
# Exports the kernel's thread list offsets (_kernel_thread_info_*). OpenOCD's `-rtos Zephyr`
# does not support riscv, so `info threads` does not list Zephyr threads; the offsets are
# usable from a gdb script. Needs !SMP.
CONFIG_DEBUG_THREAD_INFO=y
# Frame pointers give reliable backtraces in gdb and the fatal-error dump.
CONFIG_FRAME_POINTER=y
CONFIG_EXCEPTION_STACK_TRACE=y
# Catch kernel API misuse.
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
