# Runs apps written for SMP (e.g. zephyr-chipyard-sw samples with CONFIG_SMP=y,
# CONFIG_MP_MAX_NUM_CPUS=4) on the single-hart penguin. Threads share the one hart. CPU masks
# stay available for k_thread_cpu_pin(); pin-only mode needs SMP.
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_SCHED_CPU_MASK_PIN_ONLY=n
