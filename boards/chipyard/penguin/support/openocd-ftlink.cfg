# SPDX-License-Identifier: Apache-2.0
# Untested on hardware: OpenOCD config for penguin over JTAG with the FT-LINK (FTDI FT2232,
# 0403:6010) adapter.
#
# Derived from Baremetal-IDE platform/shared/ft-link.cfg (adapter) and
# platform/bearlyml/bearlyml.cfg (target). Changes for penguin:
#   - one Shuttle hart (hart 0), IR length 5 (rocket-chip DTM)
#   - work area in the 64 KiB MBUS scratchpad at 0x0800_0000
#   - no flash bank: bearlyml's "flash bank spi0 fespi 0x20000000" would hit Atlas VMEM
# JTAG clock is 50 MHz at most (tapeout poster).
#
# Standalone:
#   openocd -f openocd-ftlink.cfg -c init -c halt
#   riscv64-zephyr-elf-gdb zephyr.elf -ex 'target extended-remote :3333'
# No init/halt here; the west openocd runner issues them.

# ---- adapter: FT-LINK (from Baremetal-IDE platform/shared/ft-link.cfg) ----
adapter driver              ftdi
adapter speed               2000
adapter srst pulse_width    10000
reset_config                none
ftdi vid_pid                0x0403 0x6010
ftdi channel                0
ftdi layout_init            0x0B00 0x0B0B
ftdi layout_signal nSRST -data 0x0100 -oe 0x0100
ftdi layout_signal nTRST -data 0x0200 -oe 0x0200
ftdi layout_signal JTAG_LED -oe 0x0800
ftdi tdo_sample_edge rising
transport select            jtag

# ---- target ----
set _CHIPNAME riscv
# IDCODE unknown for penguin; bearlyml used 0x20000913. Add -expected-id once read.
jtag newtap $_CHIPNAME cpu -irlen 5
set _TARGETNAME $_CHIPNAME.cpu0
target create $_TARGETNAME riscv -chain-position $_CHIPNAME.cpu -coreid 0
$_TARGETNAME configure -work-area-phys 0x08000000 -work-area-size 0x1000 -work-area-backup 1

# Shuttle has 4 hardware triggers (breakpoints/watchpoints).
gdb_report_data_abort enable
