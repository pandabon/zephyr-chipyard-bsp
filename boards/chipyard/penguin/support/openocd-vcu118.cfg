# Untested: OpenOCD config for the whole Penguin SoC on a VCU118, JTAG through the PMOD
# header (tapeout poster: "Verified UART and JTAG functionality via PMOD"). Uses the same
# FT-LINK as openocd-ftlink.cfg; replace the `source` line for another adapter. The PMOD pin
# order comes from the bitstream's XDC.
#
#   openocd -f openocd-vcu118.cfg -c init -c halt
#   riscv64-zephyr-elf-gdb zephyr.elf -ex 'target extended-remote :3333' -ex load -ex 'break main' -ex continue
#
# Differences from the chip config: the work area is in DRAM, since the emulated design may
# lack the scratchpad, and the JTAG clock is low (it must be well below the ~100 MHz bus clock).
source [file join [file dirname [info script]] openocd-ftlink.cfg]
adapter speed 1000
# 4 KiB at the top of the first 256 MiB of DRAM (Zephyr links at the bottom).
$_TARGETNAME configure -work-area-phys 0x8ffff000 -work-area-size 0x1000 -work-area-backup 1
