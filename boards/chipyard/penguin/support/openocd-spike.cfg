# SPDX-License-Identifier: Apache-2.0
# OpenOCD config for debugging penguin on Spike. Spike emulates the RISC-V Debug Module and
# exposes the JTAG pins over a TCP socket (remote bitbang). The "spike" runner
# (scripts/runners/spike.py) starts Spike with --rbb-port and passes the port in as
# SPIKE_RBB_PORT.
#
# No init/halt here; the runner adds `-c init -c halt`.

if { ![info exists SPIKE_RBB_PORT] } { set SPIKE_RBB_PORT 9824 }

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $SPIKE_RBB_PORT
adapter speed 10000

set _CHIPNAME riscv
# Spike's JTAG TAP: 5-bit IR, IDCODE 0xdeadbeef.
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef

# Variable name expected by the runner's `-rtos Zephyr` hook.
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# Report access faults to gdb as errors instead of hanging.
gdb_report_data_abort enable
