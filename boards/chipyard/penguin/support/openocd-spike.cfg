# OpenOCD config for debugging penguin on *Spike* (not hardware).
#
# Spike emulates the RISC-V Debug Module and exposes JTAG over a TCP socket ("remote
# bitbang"). Started by `west debug|debugserver` via the "spike" runner
# (scripts/spike_runner.py), which starts Spike with --rbb-port and passes the port in as
# SPIKE_RBB_PORT.
#
# Do not `init`/`halt` here: the west runner adds `-c init -c halt` itself.

if { ![info exists SPIKE_RBB_PORT] } { set SPIKE_RBB_PORT 9824 }

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $SPIKE_RBB_PORT
adapter speed 10000

set _CHIPNAME riscv
# Spike's JTAG TAP: 5-bit IR, IDCODE 0xdeadbeef.
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef

# The runner's `-rtos Zephyr` hook refers to this variable name.
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# Report access faults to gdb as errors instead of hanging the session.
gdb_report_data_abort enable
