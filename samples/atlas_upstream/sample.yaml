# SPDX-License-Identifier: Apache-2.0
# Build only, since Spike has no Atlas model. One scenario per upstream test and board
# variant; run_tests.py builds only the board it is given, so the vcu118_ta ones SKIP by
# default (use --board chipyard_penguin/penguin/vcu118_ta -f atlas_upstream). The 9 tests
# whose golden headers need python torch are not listed (see tests.cmake).
sample:
  name: atlas_upstream
common:
  tags: atlas hardware atlas_upstream needs_path:TAPEOUT_CHIPYARD
  build_only: true
tests:
  sample.penguin.atlas_upstream.atlas_alu_basic:
    platform_allow: chipyard_penguin/penguin
    extra_args: ATLAS_TEST=atlas_alu_basic
  sample.penguin.vcu118_ta.atlas_upstream.atlas_alu_basic:
    platform_allow: chipyard_penguin/penguin/vcu118_ta
    extra_args: ATLAS_TEST=atlas_alu_basic
