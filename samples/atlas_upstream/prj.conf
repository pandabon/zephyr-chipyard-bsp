CONFIG_PRINTK=y
# Upstream tests use printf(); picolibc's stdout goes to the console.
CONFIG_STDOUT_CONSOLE=y
# Print the trap cause when the first Atlas access faults (e.g. on Spike).
CONFIG_EXCEPTION_DEBUG=y
# Upstream builds with -O2. The IMEM race tests (optA_end_jal, lower_first) depend on how
# fast the host code runs.
CONFIG_SPEED_OPTIMIZATIONS=y
# Some tests keep large arrays on the stack.
CONFIG_MAIN_STACK_SIZE=16384
