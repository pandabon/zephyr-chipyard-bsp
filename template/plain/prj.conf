# Kconfig for this app (merged over the BSP defaults; see cmake/plain_app/prj.conf).
# Uncomment what you need.
CONFIG_PRINTK=y
# Real printf/fprintf (picolibc); main.c uses printf:
CONFIG_STDOUT_CONSOLE=y
# More stack for main() (default is small; raise it for big locals or deep recursion):
# CONFIG_MAIN_STACK_SIZE=8192
# Heap for malloc():
# CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
# Debug build (-Og, asserts) is a snippet instead: make build APP=... SNIPPET=debug
